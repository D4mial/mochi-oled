CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Screen sleep time: none (max value, ~24 days of inactivity before the OLED would blank)
CONFIG_ZMK_IDLE_TIMEOUT=2147483647

# Custom status screen: narrow vertical icons instead of the default wide/landscape ones
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_FONT_MONTSERRAT_28=y
